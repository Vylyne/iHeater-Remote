; iHeater Remote: local-only firmware for the ESP32-C3 Super Mini.
; Joins the LAN from include/secrets.h (or opens an access point) and follows
; one token-paired heater_virtual over its own Moonraker WebSocket client.

[platformio]
default_envs = esp32c3-super-mini-remote

[env:esp32c3-super-mini-remote]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_raw = yes
upload_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.3
  links2004/WebSockets @ 2.7.3
build_flags =
  -DDEBUG_SERIAL=Serial
  -Iinclude
  -DIHEATER_TRIGGER_OUTPUT_PIN=3
  -DPIO_ENV=\"$PIOENV\"
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DIHEATER_WIFI_TX_POWER=WIFI_POWER_8_5dBm
  -DIHEATER_REMOTE_LOCAL=1
  -DCORE_DEBUG_LEVEL=3
  -DIHEATER_BOOT_BUTTON_PIN=9
  -DIHEATER_STATUS_LED_PIN=8
  -DIHEATER_STATUS_LED_ACTIVE_LOW=1
  ; Moonraker client: shorter connect/header stall on the main loop (library
  ; default 5 s); LAN replies are far faster.
  -DWEBSOCKETS_TCP_TIMEOUT=3000
