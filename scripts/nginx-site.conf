# HTTPS front for the iHeater Remote, written by install.sh.
# install.sh fills in the four markers below: the server name, the TLS
# certificate and key paths, and the Remote's IP address or name.
#
# nginx drops inherited proxy_set_header lines once a location sets its own,
# so every location below repeats the whole list. The two authentik headers
# are set to "" so a client can never send them itself.

server {
    listen 443 ssl;
    server_name @SERVER_NAME@;

    ssl_certificate @CERT@;
    ssl_certificate_key @KEY@;

    # The OTA image is about 1.4 MB; nginx's 1 MB default would refuse it.
    client_max_body_size 4m;

    # authentik (optional). Uncomment this block and the auth_request lines in
    # both locations, then give the two headers the variables instead of "":
    #   proxy_set_header X-authentik-username $authentik_username;
    #   proxy_set_header X-authentik-groups   $authentik_groups;
    #
    # location = /outpost.goauthentik.io/auth/nginx {
    #     internal;
    #     proxy_pass http://127.0.0.1:9000/outpost.goauthentik.io/auth/nginx;
    #     proxy_pass_request_body off;
    #     proxy_set_header Content-Length "";
    #     proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    # }
    #
    # In each location:
    #     auth_request /outpost.goauthentik.io/auth/nginx;
    #     auth_request_set $authentik_username $upstream_http_x_authentik_username;
    #     auth_request_set $authentik_groups   $upstream_http_x_authentik_groups;

    location / {
        proxy_pass http://@REMOTE@;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-authentik-username "";
        proxy_set_header X-authentik-groups "";
    }

    location /ws {
        proxy_pass http://@REMOTE@:81/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-authentik-username "";
        proxy_set_header X-authentik-groups "";
    }
}
