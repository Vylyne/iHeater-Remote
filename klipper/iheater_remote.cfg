# iHeater Remote: native Klipper chamber heater
# CONFIG_VERSION: 1
# ./install.sh compares this number to offer updates. Do not edit it.
# Requires klipper/heater_iheater_remote.py in ~/klipper/klippy/extras/.
# Replaces any existing M141 / M191 / CLEAR_VIRTUAL_CHAMBER macros.

[heater_iheater_remote chamber]
sensor: temperature_sensor chamber_hexa
#max_target: 80
# Copy from the Remote's Setup page.
#remote_token: XXXX-XXXX

[gcode_macro M141]
gcode:
  SET_HEATER_TEMPERATURE HEATER=chamber TARGET={params.S|default(0)|float}

[gcode_macro M191]
gcode:
  {% set t = params.S|default(0)|float %}
  M141 S{t}
  {% if t > 0 %}
    TEMPERATURE_WAIT SENSOR="heater_iheater_remote chamber" MINIMUM={t}
  {% endif %}
