# iHeater Remote: native Klipper chamber heater
# Requires klipper/heater_virtual.py in ~/klipper/klippy/extras/.
# Replaces any existing M141 / M191 / CLEAR_VIRTUAL_CHAMBER macros.

[heater_virtual chamber]
sensor: temperature_sensor chamber_hexa
#max_target: 80

# Read by iHeater Remote over Moonraker; written by heater_virtual.
[gcode_macro VIRTUAL_CHAMBER]
variable_target: 0
variable_temperature: -1
variable_has_sensor: 0
gcode:

[gcode_macro M141]
gcode:
  SET_HEATER_TEMPERATURE HEATER=chamber TARGET={params.S|default(0)|float}

[gcode_macro M191]
gcode:
  {% set t = params.S|default(0)|float %}
  M141 S{t}
  {% if t > 0 %}
    TEMPERATURE_WAIT SENSOR="heater_virtual chamber" MINIMUM={t}
  {% endif %}
